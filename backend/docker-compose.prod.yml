# ── 生产环境 Docker Compose 配置 ──────────────────────────────
# 后端镜像从 GitHub Container Registry (GHCR) 拉取，
# 由 .github/workflows/docker-publish.yml 在每次 push main 时自动构建。
#
# 首次部署：
#   1. cp .env.production .env && nano .env  # 填入真实密码和密钥
#   2. echo $GITHUB_TOKEN | docker login ghcr.io -u 你的GitHub用户名 --password-stdin
#   3. docker compose -f docker-compose.prod.yml pull
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. docker compose -f docker-compose.prod.yml exec backend alembic upgrade head
#
# 后续更新（服务器上执行）：
#   cd /opt/snapshop && bash deploy/update.sh
# ──────────────────────────────────────────────────────────────

services:
  backend:
    image: ghcr.io/for2006/snapshop-backend:latest
    pull_policy: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql+asyncpg://snapshop:${POSTGRES_PASSWORD}@db:5432/snapshop
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: snapshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: snapshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapshop"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add snapshop http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}) do echo '...waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing snapshop/snapshop-images;
      echo 'MinIO bucket snapshop-images ready';
      exit 0;
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - minio

  nginx:
    image: nginx:alpine
    container_name: snapshop-nginx
    ports:
      - "80:80"
    volumes:
      - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - SERVER_NAME=localhost
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
