[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-shopping-backend"
version = "0.1.0"
description = "AI Shopping Backend Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.13.3",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "redis==5.2.1",
    "python-json-logger==3.3.0",
    "httpx==0.28.1",
    "Pillow==11.1.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    "python-Levenshtein==0.26.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "prometheus-fastapi-instrumentator==7.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "RUF",    # ruff-specific rules
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "Q",      # flake8-quotes
]
ignore = [
    "E501",   # line too long (handled by line-length)
    "B008",   # do not perform function calls in argument defaults
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "RUF001", # ambiguous unicode characters (for Chinese text)
    "PLC0415", # import at top level (allow in test functions)
    "RUF013", # implicit optional (allow for legacy code)
    "PLR0912", # too many branches
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "S101"]
"*/mock_*.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
lines-between-types = 1
force-single-line = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
strict_optional = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
color_output = true
plugins = [
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
    "pytest.*",
    "httpx.*",
    "passlib.*",
    "alembic.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
